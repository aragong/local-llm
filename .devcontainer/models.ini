; Presets del router llama-server (--models-preset). Claves = flags largos sin "--".
; Presupuesto: 16303 MiB totales - ~1.5 GB de Windows/escritorio ≈ 14.7 GB para llama.cpp.
; Cifras = llama-fit-params (pesos + KV + compute), recalcular tras cambiar modelo/ctx:
;   llama-fit-params -m <gguf> -c <ctx> -ngl 99 -fa on -ctk q8_0 -ctv q8_0 -fit off -fitp on
; KV q8_0: pérdida de calidad despreciable, ~mitad de VRAM que f16. Requiere flash-attn.

version = 1

; Híbrido (DeltaNet + atención cada 4 capas): KV barata. 262144 = contexto nativo máximo.
; 4.9 + 4.6 + 1.2 ≈ 10.6 GB.
[qwen3.5-9b]
model = /models/Qwen3.5-9B-Q4_K_M.gguf
ctx-size = 262144
n-gpu-layers = 99
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
; Muestreo: model card Qwen3.5, "Thinking mode for precise coding tasks".
; presence/repeat penalty 0.0/1.0 = defaults de llama.cpp, no se repiten aquí.
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0

; 9.5 + 3.3 + 0.35 ≈ 13.1 GB (~1.6 GB de margen). Techo: 40960 ≈ 13.9 GB.
; temp/top-p: model card DeepSeek R1 (no hay set específico de código).
[deepseek-r1-14b]
model = /models/DeepSeek-R1-Distill-Qwen-14B-Q5_K_M.gguf
ctx-size = 32768
n-gpu-layers = 99
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
temp = 0.6
top-p = 0.95
