; Presets del router llama-server (--models-preset). Claves = flags largos sin "--".
; Presupuesto: 16303 MiB totales - 1.5-2.4 GB de Windows (dwm, varía) ≈ 14 GB para llama.cpp.
; Si se pasa, Windows desborda a RAM sin error: solo baja la velocidad (vigilar tok/s).
; Cifras = llama-fit-params (pesos + KV + compute), recalcular tras cambiar modelo/ctx:
;   llama-fit-params -m <gguf> -c <ctx> -ngl 99 -fa on -ctk q8_0 -ctv q8_0 -fit off -fitp on
; sleep-idle-seconds: tras 5 min sin peticiones libera VRAM; la siguiente lo recarga (~4 s).
; KV q8_0: pérdida de calidad despreciable, ~mitad de VRAM que f16. Requiere flash-attn.

version = 1

; Híbrido (DeltaNet + atención cada 4 capas): KV barata. 262144 = contexto nativo máximo.
; 4.9 + 4.6 + 1.2 ≈ 10.6 GB.
[qwen3.5-9b]
model = /models/Qwen3.5-9B-Q4_K_M.gguf
sleep-idle-seconds = 300
ctx-size = 262144
n-gpu-layers = 99
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
; Muestreo: model card Qwen3.5, "Thinking mode for precise coding tasks".
; presence/repeat penalty 0.0/1.0 = defaults de llama.cpp, no se repiten aquí.
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0

; Qwen3.6 MoE 35B (3B activos/token), variante MTP de Unsloth (UD-Q4_K_XL, 22.9 GB): no cabe
; en VRAM. n-cpu-moe = capas (de 40) cuyos expertos van a RAM (~0.45 GB/capa); atención,
; expertos compartidos y KV en GPU. Expertos en RAM ≈ 10.5 GB.
; MTP (multi-token prediction): la cabeza MTP propone 2 tokens y el modelo los verifica en
; una pasada. Cuesta ~1 GB de VRAM a 128k → 2 capas más en CPU que sin MTP. Requiere 1 slot.
; Medido en RTX 5070 Ti, servidor a 128k (tok/s generación; aceptación ~60-70 %):
;   sin MTP ncmoe 20: 57 · MTP n-max 1, ncmoe 22: 64 · MTP n-max 2, ncmoe 22: 64 (67 en código).
;   UD-Q4_K_XL vs UD-Q4_K_M: misma velocidad (63.8 vs 64.0), +0.1-0.2 GB VRAM; XL = la de la guía.
;   ncmoe 22 + MTP ≈ 13.7-13.9 GB. ncmoe 21: 14.2 GB, sin margen para dwm. Si Windows desborda la
;   VRAM, MTP cae por debajo de sin MTP (medido 42-46): vigilar tok/s.
; threads (medido con 3.5): el defecto (16 = todos los hilos lógicos) hunde a ~17 tok/s; 6/8/10 ≈ 58-62.
;   6 = un hilo por núcleo P; deja los E-cores al sistema.
; Con FLUX (sd-server) a la vez: medido sin penalización apreciable (ver README).
[qwen3.6-35b-a3b]
model = /models/mtp/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
sleep-idle-seconds = 300
ctx-size = 131072
n-gpu-layers = 99
n-cpu-moe = 22
threads = 6
parallel = 1
spec-type = draft-mtp
spec-draft-n-max = 2
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
; Muestreo: igual que el 9B (model card, "Thinking mode for precise coding tasks").
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0

; Inkling 2 Mini (Thinking Machines): MoE 26B (5.4B activos), capas 6-17 en bucle (se ejecutan 3 veces).
; Expertos a CPU solo de capas sin bucle (0-3, 20-23): 43 tok/s. Con -ncmoe 10 (capas 0-9, incluye bucle) 30.
; 8 capas en CPU ≈ 13.5 GB de llama.cpp; 10 capas: 39 tok/s, 12.4 GB.
; Drafter DSpark (nuevo y viejo) probado: aceptación 30-60 %, sin ganancia (31-36 vs 35 tok/s) y +1-1.8 GB → no se usa.
[inkling-2-mini]
model = /models/inkling/Inkling-2-Mini-UD-Q4_K_XL.gguf
sleep-idle-seconds = 300
ctx-size = 131072
n-gpu-layers = 99
override-tensor = blk\.([0-3]|2[0-3])\.ffn_.*_exps.*=CPU
threads = 6
parallel = 1
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
; Muestreo recomendado (Unsloth): sin truncar la distribución.
temp = 1.0
top-p = 1.0
top-k = 0
min-p = 0.0
