; Presets del router llama-server (--models-preset). Claves = flags largos sin "--".
; Presupuesto: 16303 MiB totales - 1.5-2.4 GB de Windows (dwm, varía) ≈ 14 GB para llama.cpp.
; Si se pasa, Windows desborda a RAM sin error: solo baja la velocidad (vigilar tok/s).
; Cifras = llama-fit-params (pesos + KV + compute), recalcular tras cambiar modelo/ctx:
;   llama-fit-params -m <gguf> -c <ctx> -ngl 99 -fa on -ctk q8_0 -ctv q8_0 -fit off -fitp on
; KV q8_0: pérdida de calidad despreciable, ~mitad de VRAM que f16. Requiere flash-attn.

version = 1

; Híbrido (DeltaNet + atención cada 4 capas): KV barata. 262144 = contexto nativo máximo.
; 4.9 + 4.6 + 1.2 ≈ 10.6 GB.
[qwen3.5-9b]
model = /models/Qwen3.5-9B-Q4_K_M.gguf
ctx-size = 262144
n-gpu-layers = 99
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
; Muestreo: model card Qwen3.5, "Thinking mode for precise coding tasks".
; presence/repeat penalty 0.0/1.0 = defaults de llama.cpp, no se repiten aquí.
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0

; Q4_K_M (no Q5): 1.5 GB menos → +12k de contexto y +11% tok/s (llama-bench), a cambio de algo de precisión.
; 8.1 + 4.5 + 0.35 ≈ 13.1 GB. Medido: 44k → 69 tok/s; 48k → 58 tok/s (desborda VRAM).
; temp/top-p: model card DeepSeek R1 (no hay set específico de código).
[deepseek-r1-14b]
model = /models/DeepSeek-R1-Distill-Qwen-14B-Q4_K_M.gguf
ctx-size = 45056
n-gpu-layers = 99
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
temp = 0.6
top-p = 0.95
